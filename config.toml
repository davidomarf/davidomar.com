baseURL = "https://davidomar.com/"
languageCode = "en-us"
title = "i'm david"
theme = "hugo-journal"

enableRobotsTXT = true

[params]
  description = "i'm a developer and artist. i maintain a blog about generative art. i write some ideas about software or life. lowercasing is deliberate"
  githubUsername = "davidomarf"
  twitterUsername = "davidomarf"
  tagline = """
  [resume](/resume) &nbsp; • &nbsp;
  [writings](#writings) &nbsp; • &nbsp;
  [projects](#projects) &nbsp; • &nbsp;
  [talks](#talks)
  """
  resume = "./resume.pdf"

[params.work]
  jobTitle = "Author"
  company = "Generative Mistakes"
  companyUrl = "https://generativemistakes.art/"
[params.gpg]
  key = "0x9E07A0FB801E18A9"
  fingerprint = "E069 59EE 0FFA 5971 6569 436A 9E07 A0FB 801E 18A9"
  link = "https://pgp.mit.edu/pks/lookup?op=get&search=0x9E07A0FB801E18A9"
[params.author]
  name = "David Omar"
  lastname = "Flores Chávez"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.typographer]
        leftSingleQuote = "'"
        rightSingleQuote = "'"
        leftDoubleQuote = '"'
        rightDoubleQuote = '"'
        apostrophe = "'"
  [markup.tableOfContents]
    endLevel = 2
    ordered = false
    startLevel = 2
  [markup.highlight]
    noClasses = false
    codeFences = true
    tabWidth = 2
    highlightjs = false

[minify]
  disableHTML = false
  disableCSS = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepQuotes = true
      keepWhitespace = false
